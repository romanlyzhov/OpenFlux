name: iOS build check

# Compiles the iOS app of a branch without signing: the same steps as
# build_ios_app.sh up to the archive, with code signing turned off.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        required: true
        default: ios-testflight
      runner:
        description: Hosted macOS runner (arm64 ones may wait long for capacity)
        type: choice
        options: [macos-26-intel, macos-26]
        default: macos-26-intel

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Go static library
        run: |
          ./build_ios.sh
          mkdir -p ios-app/Lib
          cp output/ios/liboflux.a output/ios/liboflux.h ios-app/Lib/

      - name: Shared Kotlin UI
        run: ./gradlew --no-daemon :iosUi:linkReleaseFrameworkIosArm64 :iosUi:assembleIosArm64MainResources :shared:prepareComposeResourcesTaskForCommonMain

      # The project's default iOS 15 target is raised to 16 in this checkout only: the Swift
      # sources do not build for iOS 15 with this Xcode ('buildIf' is only available in
      # iOS 16.0 or newer), which is unrelated to the check.
      - name: Xcode project
        working-directory: ios-app
        run: |
          brew install xcodegen
          sed -i '' 's/iOS: "15.0"/iOS: "16.0"/' project.yml
          xcodegen generate

      - name: App build (unsigned)
        working-directory: ios-app
        run: xcodebuild -project OpenFlux.xcodeproj -scheme OpenFlux -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
